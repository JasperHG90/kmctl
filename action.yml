name: kmctl knowledge checks
description: >-
  Run kmctl check and kmctl review due on a repository's docs/ and .okf/ bundle,
  write both to the job summary, and fail when kmctl check fails or kmctl review due crashes.
  Concepts that are due for review are reported, never failed. With
  mode: audit, run the agent in action/agent.py instead, against any model
  provider, and keep its report as an artifact; with mode: publish, in a
  later job, post that report to one GitHub issue, or on a pull request to
  one comment.
inputs:
  path:
    description: The repository folder to check, relative to the workspace.
    required: false
    default: "."
  drafts:
    description: >-
      How mode checks treats decision records whose status is draft (ADR 0050).
      fail-when-ready (the default) runs kmctl check --no-drafts on a pull
      request that is ready for review, so a draft fails there and passes on a
      draft pull request or a push. Add ready_for_review to the workflow's
      pull_request types, so marking a pull request ready runs the check again.
      fail always fails on a draft; pass never does.
    required: false
    default: fail-when-ready
  summary:
    description: >-
      How mode checks treats a .okf/summary.md behind the concepts that
      changed after it (ADR 0056). fail (the default) fails the check, and the
      message says to update the summary or run kmctl summary ack; pass only
      warns.
    required: false
    default: fail
  mode:
    description: >-
      checks (the default) runs kmctl check and kmctl review due. audit runs
      the agent in action/agent.py (PydanticAI) on one of its shipped audits
      (audit), or on the task prompt or prompt_file gives it. It can read the
      repository, the context and skills folders, and run shell commands, and
      it uploads its report as the report_name artifact. It
      needs model, runs on workflow_dispatch, schedule or a pull_request from
      the same repository (ADR 0057), and refuses to start when it could read
      a GitHub token: check out with persist-credentials: false and
      fetch-depth: 0, and set no GH_TOKEN or GITHUB_TOKEN for the job. A pull
      request from a fork or from Dependabot gets a notice and no audit, and
      the step still passes. On a pull request the agent runs without a
      shell, reads prompt_file, system_prompt_file, context and skills that
      git tracks from a checkout of the base branch, and gets --base for the
      okf-vs-change audit. Also set timeout-minutes on the step, since a
      composite action cannot set it on its own steps. publish runs in a
      separate job (needs: the audit job, issues: write, or pull-requests:
      write on a pull request, and a checkout for CODEOWNERS): it downloads
      report_name and posts it with action/agent.py publish, to one issue,
      or on a pull request to one comment it replaces on each push. With no
      report it posts nothing and passes. The agent's job and this one share
      nothing but the artifact, so nothing the agent changed runs with the
      token.
    required: false
    default: checks
  model:
    description: >-
      Audit mode, required. Without base_url, PydanticAI's provider:model name,
      such as openai:gpt-5 or openrouter:qwen/qwen3-coder; set the provider's
      own key variable (OPENAI_API_KEY, OPENROUTER_API_KEY and so on) in the
      env of the step that uses this action. With base_url, the model name the
      endpoint serves.
    required: false
    default: ""
  base_url:
    description: >-
      Audit mode: an OpenAI-compatible endpoint's base URL, ending in /v1 for
      most servers (for example http://localhost:11434/v1 for Ollama). Empty:
      use model's provider.
    required: false
    default: ""
  api_key_env:
    description: >-
      Audit mode, with base_url: the name of the environment variable that
      holds the API key, such as AUDIT_API_KEY. Set that variable from a secret
      in the env of the step that uses this action. Leave empty for an endpoint
      that takes no key.
    required: false
    default: ""
  audit:
    description: >-
      Audit mode: a shipped audit to run. docs-vs-code checks docs/ against
      the code, okf-vs-code checks .okf/ against the code, okf-vs-docs
      checks docs/ against .okf/, and okf-vs-change checks the stable
      decisions whose sources a pull request changed (it runs only on a pull
      request, where the base branch is known). Empty: okf-vs-code, unless
      prompt or prompt_file gives a task of your own.
    required: false
    default: ""
  prompt:
    description: >-
      Audit mode: the agent's task, as text, instead of audit.
    required: false
    default: ""
  prompt_file:
    description: >-
      Audit mode: a file holding the agent's task, relative to path, instead of
      audit. On a pull request a file git tracks comes from the base branch,
      so a pull request that adds one fails its own audit until it merges.
    required: false
    default: ""
  system_prompt_file:
    description: >-
      Audit mode: a file that replaces the shipped system prompt, relative to
      path. Empty: the shipped one, which lists the folders the agent can read
      and its skills.
    required: false
    default: ""
  context:
    description: >-
      Audit mode: folders the agent can read besides the repository, one per
      line, relative to path; for example docs an earlier step fetched. On a
      pull request a folder git tracks comes from the base branch, and one it
      does not track, such as a fetched folder, stays in the workspace.
    required: false
    default: ""
  skills:
    description: >-
      Audit mode: skill folders (each holding subfolders with a SKILL.md), one
      per line, relative to path. Empty: kmctl's own skills.
    required: false
    default: ""
  timeout:
    description: >-
      Audit mode: how long the agent may run, in seconds or with s, m, h or d.
    required: false
    default: 30m
  min_severity:
    description: >-
      Publish mode: the lowest severity (info, low, medium or high) that opens
      or updates the issue; below it, an open issue is closed.
    required: false
    default: high
  mention:
    description: >-
      Publish mode: users or teams to mention, such as @alice or @org/team,
      one per line. Empty: the owners of the last * rule in CODEOWNERS.
    required: false
    default: ""
  issue_title:
    description: Publish mode, the issue's title.
    required: false
    default: Knowledge audit
  report_name:
    description: >-
      Audit and publish modes: the artifact's name, which audit mode uploads
      and publish mode downloads. Give each audit in one workflow its own,
      such as agent-report-docs-vs-code.
    required: false
    default: agent-report
runs:
  using: composite
  steps:
    - name: Check the mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          checks | audit | publish) ;;
          *) echo "kmctl action: mode must be checks, audit or publish, not '$MODE'." >&2; exit 1 ;;
        esac
    # No cache: a cache saved after the agent ran would carry what it wrote
    # into the publish job.
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false
    - name: Install kmctl from this action's checkout
      if: inputs.mode != 'publish'
      shell: bash
      run: uv tool install "${{ github.action_path }}/packages/kmctl"
    # KMCTL_PINNED: run the kmctl this action installed, whatever release the
    # repository's apm.lock.yaml pins (ADR 0026).
    - name: Check knowledge
      if: inputs.mode == 'checks'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        KMCTL_PINNED: "1"
        KMCTL_DRAFTS: ${{ inputs.drafts }}
        KMCTL_SUMMARY: ${{ inputs.summary }}
      run: bash "${{ github.action_path }}/action/knowledge-ci.sh"
    # The API key reaches the model, so a fork's or Dependabot's pull request,
    # which gets no secrets, is skipped and every other event but a same-repo
    # pull request is refused (ADR 0005, ADR 0057). A skip passes: the later
    # steps check the run output, since exit 0 alone does not skip them.
    - name: Check the event
      id: event
      if: inputs.mode == 'audit'
      shell: bash
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          workflow_dispatch | schedule) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          pull_request)
            if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
              echo "::notice::kmctl audit: skipped; a pull request from a fork gets no secrets, so no audit."
              echo "run=false" >> "$GITHUB_OUTPUT"
            elif [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::notice::kmctl audit: skipped; a Dependabot pull request gets no secrets, so no audit."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi ;;
          *) echo "kmctl audit: refused for event '$GITHUB_EVENT_NAME'; audit mode runs on workflow_dispatch, schedule or a pull_request from the same repository." >&2; exit 1 ;;
        esac
    # --no-config: uv would otherwise read a uv.toml or pyproject.toml from the
    # checkout, which a pull request controls, and could install other code.
    # No GitHub token in this step: the agent can run shell commands, except
    # on a pull request, where it runs without a shell and reads its
    # instructions from a checkout of the base branch outside the repository.
    - name: Run the agent
      if: inputs.mode == 'audit' && steps.event.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        KMCTL_PINNED: "1"
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base_url }}
        API_KEY_ENV: ${{ inputs.api_key_env }}
        AUDIT: ${{ inputs.audit }}
        PROMPT: ${{ inputs.prompt }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        SYSTEM_PROMPT_FILE: ${{ inputs.system_prompt_file }}
        CONTEXT: ${{ inputs.context }}
        SKILLS: ${{ inputs.skills }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        args=(run --model "$MODEL" --out "$RUNNER_TEMP/agent-report" --timeout "$TIMEOUT")
        [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
        [ -n "$API_KEY_ENV" ] && args+=(--api-key-env "$API_KEY_ENV")
        [ -n "$AUDIT" ] && args+=(--audit "$AUDIT")
        [ -n "$PROMPT" ] && args+=(--prompt "$PROMPT")
        [ -n "$PROMPT_FILE" ] && args+=(--prompt-file "$PROMPT_FILE")
        [ -n "$SYSTEM_PROMPT_FILE" ] && args+=(--system-prompt-file "$SYSTEM_PROMPT_FILE")
        while IFS= read -r dir; do [ -n "$dir" ] && args+=(--context "$dir"); done <<< "$CONTEXT"
        while IFS= read -r dir; do [ -n "$dir" ] && args+=(--skills "$dir"); done <<< "$SKILLS"
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          base="origin/$GITHUB_BASE_REF"
          checkout="$(mktemp -d "$RUNNER_TEMP/kmctl-base.XXXXXX")"
          git worktree add --detach --quiet "$checkout" "$base"
          args+=(--instructions-root "$checkout/$(git rev-parse --show-prefix)" --base "$base" --no-shell)
        fi
        uv run --no-config --script "${{ github.action_path }}/action/agent.py" "${args[@]}"
    - name: Keep the report
      if: always() && inputs.mode == 'audit'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report_name }}
        path: ${{ runner.temp }}/agent-report
        if-no-files-found: ignore
    # A separate job: a fresh runner that gets only the artifact. A skipped or
    # failed audit leaves no artifact; publish then posts nothing and passes.
    - name: Download the report
      if: inputs.mode == 'publish'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.report_name }}
        path: ${{ runner.temp }}/agent-report
    - name: Publish the report
      if: inputs.mode == 'publish'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        MIN_SEVERITY: ${{ inputs.min_severity }}
        MENTION: ${{ inputs.mention }}
        ISSUE_TITLE: ${{ inputs.issue_title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        args=(publish "$RUNNER_TEMP/agent-report/report.json" --min-severity "$MIN_SEVERITY" --title "$ISSUE_TITLE")
        while IFS= read -r who; do [ -n "$who" ] && args+=(--mention "$who"); done <<< "$MENTION"
        [ "$GITHUB_EVENT_NAME" = pull_request ] && args+=(--pr "$PR_NUMBER")
        uv run --no-config --script "${{ github.action_path }}/action/agent.py" "${args[@]}"
