[project]
name = "kmaudit"
# apm/apm.yml, kmaudit's APM package, carries the version (ADR 0045); see
# [tool.hatch.version].
dynamic = ["version"]
description = "Audit what a folder of markdown docs claims about its repository, through a coding agent."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jasper Ginn", email = "jasperginn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ast-grep-py>=0.51.2",
    "httpx>=0.28.1",
    "jmespath>=1.1.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.optional-dependencies]
tracing = ["langsmith>=0.14.17"]

[project.scripts]
kmaudit = "kmaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "apm/apm.yml"
pattern = '(?m)^version: (?P<version>[^\s#]+)'

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "apm/apm.yml" }]

[tool.hatch.build.targets.wheel]
packages = ["src/kmaudit"]
