<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kmaudit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* A proofreader's desk: cool paper, blue-pencil selection, and one mark per
     kind of coverage. The marks are the loud part; everything else stays quiet. */
  :root {
    --paper: #eef1f5; --sheet: #ffffff; --ink: #17202b; --soft: #5b6676; --rule: #d5dbe3;
    --pencil: #2747d6; --pencil-wash: #e3e9ff;
    --drift: #c4302b; --drift-wash: #fbe4e2;
    --unchecked: #a86a12; --unchecked-wash: #fbeed3;
    --reason: #6a48c0; --reason-wash: #ece6fa;
    --checked: #2c7a4d; --checked-wash: #dff1e5;
    --pending: #7b8594; --pending-wash: #e3e7ec;
    --quiet: #c3cad4;
    --tag-claims: #d9534f; --tag-checks: #3d9a63; --tag-conf: #d9a520;
    --ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --text: "Source Serif 4", Georgia, "Times New Roman", serif;
    --code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10151c; --sheet: #171e27; --ink: #e6ebf2; --soft: #94a0b1; --rule: #2a3441;
      --pencil: #8ea5ff; --pencil-wash: #222d55;
      --drift: #ff8f87; --drift-wash: #3b1f1f;
      --unchecked: #eebb62; --unchecked-wash: #382b14;
      --reason: #b9a4ff; --reason-wash: #2a2347;
      --checked: #7fd3a0; --checked-wash: #17301f;
      --pending: #9aa5b4; --pending-wash: #252d38;
      --quiet: #3a4554;
      --tag-claims: #e0706c; --tag-checks: #58b47e; --tag-conf: #e0b440;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui);
         display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; border-radius: 4px; }
  code { font-family: var(--code); font-size: .86em; }

  /* Top bar */
  .bar { display: flex; align-items: center; gap: 20px; padding: 10px 20px; border-bottom: 1px solid var(--rule); flex: none; }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .totals { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--soft); font-size: 13px; flex: 1; }
  .totals b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .totals .bad b { color: var(--drift); }
  .stamp { color: var(--soft); font-size: 12px; white-space: nowrap; }
  .reload { color: var(--pencil); font-size: 12px; font-weight: 600; margin-left: 8px; }
  .reload:hover { text-decoration: underline; }

  .desk { display: grid; grid-template-columns: 290px minmax(0, 1fr) 400px; flex: 1; min-height: 0; }
  .desk > section { overflow: auto; min-height: 0; }

  /* Left: documents */
  .docs { padding: 14px 10px 24px 14px; border-right: 1px solid var(--rule); }
  .filter { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 7px;
            background: var(--sheet); color: var(--ink); font: inherit; }
  .filter::placeholder { color: var(--soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
  .chip { padding: 2px 10px; border-radius: 99px; border: 1px solid var(--rule); font-size: 12px; color: var(--soft); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .folder { margin: 16px 0 4px 8px; font-size: 12px; font-weight: 600; color: var(--soft); }
  .doc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline;
         width: 100%; padding: 6px 8px; border-radius: 7px; }
  .doc:hover { background: var(--sheet); }
  .doc[aria-current="true"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--pencil); }
  .doc .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .doc .count { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .doc .count.drift { color: var(--drift); } .doc .count.unchecked { color: var(--unchecked); }
  .doc .count.pending { color: var(--pending); }
  .meter { grid-column: 1 / -1; display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--quiet); }
  .meter i { display: block; }
  .none-found { color: var(--soft); padding: 12px 8px; }

  /* Middle: the document */
  .viewer { background: var(--sheet); }
  .viewer-head { position: sticky; top: 0; z-index: 2; background: var(--sheet); padding: 18px 40px 10px;
                 border-bottom: 1px solid var(--rule); }
  .viewer-head h2 { margin: 0; font: 600 24px/1.2 var(--text); letter-spacing: -.01em; }
  .path { color: var(--soft); font-size: 12px; margin-top: 2px; }
  .strip { display: flex; gap: 1px; height: 18px; margin: 12px 0 8px; }
  .strip button { flex: 1 1 0; min-width: 2px; border-radius: 1px; background: var(--quiet); }
  .strip button:hover { transform: scaleY(1.35); }
  .strip button.on { outline: 2px solid var(--pencil); outline-offset: 1px; }
  .strip .gap { flex: 0 0 5px; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); }
  .key button { display: inline-flex; align-items: center; gap: 6px; }
  .key button:hover { color: var(--ink); }
  .key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .key .hint { margin-left: auto; }
  kbd { font: 500 11px var(--ui); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }

  .page { padding: 8px 40px 80px; max-width: 78ch; font: 16.5px/1.68 var(--text); }
  .sec { padding: 14px 0 6px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; width: 100%; margin-bottom: 4px; font-family: var(--ui); }
  .sec-head .crumb { color: var(--soft); font-size: 12px; }
  .sec-head .title { font-size: 15px; font-weight: 700; }
  .sec-head .tally { margin-left: auto; font-size: 12px; color: var(--soft); white-space: nowrap; }
  .sec-head:hover .title { color: var(--pencil); }
  .sec.on { box-shadow: -14px 0 0 var(--sheet), -17px 0 0 var(--pencil); }
  .sec.on .sec-head .title { color: var(--pencil); }
  .flag-pending { font-size: 11px; font-weight: 600; color: var(--pending); background: var(--pending-wash); padding: 1px 8px; border-radius: 99px; }

  .s { cursor: pointer; border-radius: 2px; text-underline-offset: 4px; text-decoration-thickness: 1.5px;
       -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .s:hover { background: var(--pencil-wash); }
  .brk { display: block; height: 6px; }
  .s.cov-checked { text-decoration: underline solid color-mix(in srgb, var(--checked) 55%, transparent); text-decoration-thickness: 1px; }
  .s.cov-reason { text-decoration: underline dotted var(--reason); text-decoration-thickness: 2px; }
  .s.cov-unchecked { text-decoration: underline dashed var(--unchecked); background: var(--unchecked-wash); }
  .s.cov-drift { text-decoration: underline wavy var(--drift); background: var(--drift-wash); }
  .s.cov-pending { background: var(--pending-wash); }
  .s.cov-none, .s.cov-uncheckable { color: var(--soft); }
  .s.on, .s.on:hover { background: var(--pencil-wash); box-shadow: 0 2px 0 var(--pencil); }
  .s.block.on { box-shadow: 0 0 0 2px var(--pencil); }
  .s.block { display: block; margin: 10px 0; padding: 8px 12px; text-decoration: none; overflow-x: auto;
             border-left: 3px solid var(--quiet); border-radius: 0 6px 6px 0; background: var(--paper);
             font: 13px/1.5 var(--ui); color: var(--ink); }
  .s.block.cov-checked { border-left-color: var(--checked); } .s.block.cov-reason { border-left-color: var(--reason); }
  .s.block.cov-unchecked { border-left-color: var(--unchecked); } .s.block.cov-drift { border-left-color: var(--drift); }
  .s.block.cov-pending { border-left-color: var(--pending); }
  .s.block pre { margin: 0; font: 12.5px/1.5 var(--code); white-space: pre; }
  .s.block table { border-collapse: collapse; width: 100%; }
  .s.block th, .s.block td { text-align: left; vertical-align: top; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--rule); }
  .s.block th { font-weight: 600; }

  /* Right: claims, checks, confidence */
  .detail { padding: 16px 16px 60px 8px; border-left: 1px solid var(--rule); }
  .where { margin: 0 0 12px 30px; font-size: 13px; color: var(--soft); }
  .where b { color: var(--ink); font-weight: 600; }
  /* One card per claim: the claim, its check and its confidence stacked on one coloured edge. */
  .claim { position: relative; margin: 0 0 14px 22px; background: var(--sheet); border-radius: 0 8px 8px 0; }
  .claim::before { content: ""; position: absolute; left: -15px; top: 10px; width: 16px; height: 26px;
                   background: var(--tag-claims); clip-path: polygon(100% 0, 100% 100%, 0 50%); }
  .part { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 6px; padding: 10px 14px 10px 10px;
          border-left: 4px solid var(--hue); }
  .part + .part { border-top: 1px solid var(--rule); }
  .part.p-claim { --hue: var(--tag-claims); border-radius: 0 8px 0 0; }
  .part.p-check { --hue: var(--tag-checks); }
  .part.p-conf { --hue: var(--tag-conf); }
  .part .label { font-size: 12px; font-weight: 700; color: var(--hue); padding-top: 1px; }
  .part .what { font-size: 13.5px; }
  .part .sub { color: var(--soft); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
  .part .dim { color: var(--soft); }
  .claim.shut .part:not(.p-claim) { display: none; }
  .claim.fold .p-claim { cursor: pointer; }
  .claim.fold .p-claim:hover { background: var(--pencil-wash); }
  .to-sentence { color: var(--pencil); font-size: 12px; font-weight: 600; }
  .to-sentence:hover { text-decoration: underline; }
  .status { font-weight: 600; padding: 0 7px; border-radius: 99px; font-size: 11px; white-space: nowrap; }
  .st-checked { color: var(--checked); background: var(--checked-wash); }
  .st-reason { color: var(--reason); background: var(--reason-wash); }
  .st-unchecked { color: var(--unchecked); background: var(--unchecked-wash); }
  .st-drift { color: var(--drift); background: var(--drift-wash); }
  .st-none { color: var(--soft); background: var(--pending-wash); }
  .steps { margin: 6px 0 0; padding: 0; list-style: none; }
  .steps li { font: 12px/1.5 var(--code); padding: 4px 8px; margin-top: 3px; background: var(--paper); border-radius: 5px;
              overflow-wrap: anywhere; }
  .steps li b { font-weight: 500; color: var(--tag-checks); }
  .steps li.failed { box-shadow: inset 3px 0 0 var(--drift); }
  .steps .mark { display: inline-block; margin-right: 8px; font: 600 11px var(--ui); }
  .steps .mark.ok { color: var(--checked); } .steps .mark.bad { color: var(--drift); }
  .steps .saw { margin-top: 3px; color: var(--soft); font-family: var(--ui); font-size: 11.5px; }
  .verdict { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
  .verdict span { font-weight: 400; color: var(--soft); }
  .verdict.ok { color: var(--checked); } .verdict.bad { color: var(--drift); } .verdict.pending { color: var(--unchecked); }
  .drift-note { margin-top: 6px; padding: 6px 8px; border-radius: 5px; background: var(--drift-wash); color: var(--drift); font-size: 12.5px; }
  .note { margin: 6px 0 0; font-size: 12.5px; color: var(--soft); line-height: 1.5; }
  .note b, .part .what b { color: var(--ink); font-weight: 600; }
  .missed ul ul { margin: 0 0 4px; }
  .missed { margin-top: 6px; font-size: 12px; color: var(--soft); }
  .missed summary { cursor: pointer; }
  .missed ul { margin: 4px 0 0; padding-left: 16px; overflow-wrap: anywhere; }
  .gauge { display: flex; gap: 2px; margin-top: 6px; }
  .gauge i { flex: 1; max-width: 22px; height: 6px; border-radius: 2px; background: var(--quiet); }
  .gauge i.hit { background: var(--tag-conf); }
  /* Documents or code: two views of the same claims. */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; margin-bottom: 10px;
           border-radius: 8px; background: var(--rule); }
  .modes button { padding: 5px 0; border-radius: 6px; text-align: center; font-size: 13px; font-weight: 600; color: var(--soft); }
  .modes button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .doc .pct { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--soft); }
  .doc .pct.some { color: var(--checked); }
  /* The code view: a quiet listing with one coloured mark per matched line. */
  .page.code-page { max-width: none; padding: 0; font: inherit; }
  .code { padding: 8px 0 80px; font: 12.5px/1.6 var(--code); counter-reset: none; }
  .ln { display: grid; grid-template-columns: 56px 4px minmax(0, 1fr); align-items: stretch; cursor: default; }
  .ln .no { padding-right: 12px; text-align: right; color: var(--quiet); user-select: none; }
  .ln .mk { border-radius: 1px; }
  .ln .tx { padding: 0 16px 0 12px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .ln.hit { cursor: pointer; }
  .ln.hit .mk { background: color-mix(in srgb, var(--checked) 70%, transparent); }
  .ln.hit .tx { background: color-mix(in srgb, var(--checked-wash) 55%, transparent); }
  .ln.drift .mk { background: var(--drift); }
  .ln.drift .tx { background: var(--drift-wash); }
  .ln.hit:hover .tx { background: var(--pencil-wash); }
  .ln.on .tx { background: var(--pencil-wash); box-shadow: inset 0 -1px 0 var(--pencil); }
  .ln.on .no { color: var(--pencil); font-weight: 600; }
  .code-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); margin-top: 8px; }
  .code-key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .code-key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .code-links { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
  .code-links button { font: 500 11.5px var(--code); color: var(--pencil); }
  .code-links button:hover { text-decoration: underline; }
  .view-code { margin-top: 6px; }
  .view-code-btn { font: 500 12px var(--ui); color: var(--pencil); border: 1px solid var(--rule); border-radius: 5px; padding: 2px 9px; }
  .view-code-btn:hover { background: var(--pencil-wash); }
  .snips { margin-top: 6px; display: grid; gap: 8px; }
  .snip { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .snip-head { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; font: 500 11.5px var(--code); color: var(--soft); background: var(--pencil-wash); }
  .snip-head .snip-where { flex: 1; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip-head button { color: var(--pencil); font: 500 11.5px var(--ui); white-space: nowrap; }
  .snip-head button:hover { text-decoration: underline; }
  .snip .code { padding: 4px 0; font-size: 11.5px; line-height: 1.5; overflow-x: auto; }
  .snip .code.whole { max-height: 320px; overflow-y: auto; }
  .snip .ln { grid-template-columns: 34px 3px max-content; width: max-content; min-width: 100%; cursor: default; }
  .snip .ln .no { padding-right: 8px; }
  .snip .ln .tx { padding: 0 8px; overflow: visible; text-overflow: clip; }
  .snip-more { margin: 2px 8px 4px; font-size: 11.5px; }
  .readers { margin: 0 0 0 30px; font-size: 13px; color: var(--soft); line-height: 1.55; }
  .readers summary { cursor: pointer; }
  .readers ul { margin: 6px 0 0; padding-left: 18px; }
  .readers li { margin: 3px 0; }
  .readers button { display: inline; color: var(--ink); text-align: left; }
  .readers button:hover { color: var(--pencil); text-decoration: underline; }

  /* Feedback: thumbs, a verdict and a note under each part; quiet until used. */
  .fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .fb-btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 6px;
            border: 1px solid var(--rule); color: var(--soft); font-size: 12px; font-weight: 500; }
  .fb-btn svg { width: 14px; height: 14px; }
  .fb-btn:hover { color: var(--ink); border-color: var(--soft); }
  .fb-btn[aria-pressed="true"].up { color: var(--checked); background: var(--checked-wash); border-color: var(--checked); }
  .fb-btn[aria-pressed="true"].down { color: var(--drift); background: var(--drift-wash); border-color: var(--drift); }
  .fb-btn[aria-pressed="true"].holds { color: var(--checked); background: var(--checked-wash); border-color: var(--checked); }
  .fb-btn[aria-pressed="true"].false { color: var(--drift); background: var(--drift-wash); border-color: var(--drift); }
  .fb-btn:disabled { opacity: .5; cursor: progress; }
  .fb .ask { color: var(--soft); font-size: 12px; margin-left: 6px; }
  .fb .ask.first { margin-left: 0; }
  .fb .seg { display: inline-flex; }
  .fb .seg .fb-btn:first-child { border-radius: 6px 0 0 6px; }
  .fb .seg .fb-btn + .fb-btn { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .fb-note { margin-top: 6px; padding: 6px 9px; border-left: 2px solid var(--rule); color: var(--ink); font-size: 12.5px; white-space: pre-wrap; }
  .fb-edit { display: grid; gap: 6px; margin-top: 6px; }
  .fb-edit textarea { width: 100%; min-height: 64px; resize: vertical; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px;
                      background: var(--paper); color: var(--ink); font: 13px/1.45 var(--ui); }
  .fb-edit .row { display: flex; gap: 6px; }
  .primary { height: 26px; padding: 0 12px; border-radius: 6px; background: var(--pencil); color: #fff; font-size: 12px; font-weight: 600; }
  .primary:disabled { opacity: .5; cursor: progress; }
  .fb-state { margin-top: 5px; font-size: 12px; color: var(--soft); }
  .fb-state.sent { color: var(--pencil); }
  .fb-error { margin-top: 5px; font-size: 12px; color: var(--drift); }
  .fb-note.other { color: var(--soft); }
  .fb-note.other .sub { font-size: 12px; margin-bottom: 2px; }
  .disagree { margin-top: 8px; padding: 6px 8px; border-radius: 5px; background: var(--unchecked-wash); color: var(--unchecked); font-size: 12.5px; }
  .opinion { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--rule); font-size: 12.5px; }
  .opinion .what { font-size: 13px; }
  .blank { color: var(--soft); font-size: 13.5px; margin: 0 0 0 30px; line-height: 1.6; }
  .start { margin: 60px 20px 0 30px; color: var(--soft); font-size: 14px; line-height: 1.6; }

  @media (prefers-reduced-motion: no-preference) {
    .cards.moved { animation: settle .14s ease-out; }
    .strip button { transition: transform .08s; }
    @keyframes settle { from { opacity: .4; transform: translateX(6px); } }
  }
  @media (max-width: 1080px) { .desk { grid-template-columns: 240px minmax(0, 1fr) 340px; } .viewer-head, .page { padding-left: 24px; padding-right: 24px; } }
  @media (max-width: 860px) {
    body { height: auto; display: block; }
    .desk { display: block; }
    .desk > section { overflow: visible; }
    .docs { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 40vh; overflow: auto !important; }
    .viewer-head { position: static; }
    .viewer-head, .page { padding-left: 16px; padding-right: 16px; }
    .detail { border-left: 0; border-top: 1px solid var(--rule); padding: 16px; }
    .bar { flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px; }
    .key .hint { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>kmaudit</h1>
  <div class="totals" id="totals"></div>
  <span class="stamp" id="stamp"></span>
</header>
<main class="desk">
  <section class="docs" aria-label="Documents and code">
    <div class="modes" id="modes" role="tablist"></div>
    <input class="filter" id="filter" type="search" placeholder="Find a document" aria-label="Find a document">
    <div class="chips" id="chips"></div>
    <nav id="tree"></nav>
  </section>
  <section class="viewer" id="viewer" aria-label="Document">
    <div class="viewer-head" id="head"></div>
    <article class="page" id="page"></article>
  </section>
  <section class="detail" id="detail" aria-label="Claims and checks"></section>
</main>
<script>
let DATA = null;

// Coverage kinds in the order they are drawn and listed, worst first.
const KINDS = [
  ["drift", "drift", "--drift"],
  ["unchecked", "not checked", "--unchecked"],
  ["pending", "needs extraction", "--pending"],
  ["reason", "reason only", "--reason"],
  ["checked", "checked", "--checked"],
];
const KIND_LABEL = Object.fromEntries(KINDS.map(([k, label]) => [k, label]));
const CHIPS = [["all", "All"], ["drift", "Drift"], ["unchecked", "Not checked"], ["outdated", "Needs extraction"]];

/* ---------- markdown, just enough for a sentence ---------- */

    el("tbody", {}, rows.slice(1).map((r) => el("tr", {}, r.map((c) => el("td", {}, inline(c)))))));

  const hit = back ? all.filter((x) => rank(x) < at).at(-1) || all.at(-1) : all.find((x) => rank(x) > at) || all[0];

/* ---------- feedback and second opinions ---------- */
let openCards = new Set();   // claim ids whose folded card the reader opened

const ICON = {

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({ error: `the server answered ${res.status}` }));

// Put a claim the server sent back into the data, then redraw its marks and cards in place.
function replaceClaim(view) {
  for (const doc of DATA.concepts) for (const sec of doc.sections) {

    if (!s) continue;
    s.claims = s.claims.map((c) => (c.id === view.id ? view : c));
    s.coverage = sentenceCoverage(sec.pending, s.claims);

  codeLine = n;
  for (const [k, row] of Object.entries(codeNodes)) row.classList.toggle("on", Number(k) === n);
  for (const b of codeBlocks) b.tick?.classList.toggle("on", n >= b.start && n <= b.end);
  if (scroll) codeNodes[n]?.scrollIntoView({ block: "center" });
  renderCodeCards();
  writeHash();
}
function nextLine(back = false, failingOnly = false) {
  if (!codeFile) return;
  const lines = Object.keys(codeFile.hits).map(Number).filter((n) => !failingOnly || codeFile.hits[n].drift).sort((a, b) => a - b);
  if (!lines.length) return;
  const at = codeLine ?? (back ? Infinity : 0);
  const hit = back ? lines.filter((x) => x < at).at(-1) ?? lines.at(-1) : lines.find((x) => x > at) ?? lines[0];
  selectLine(hit, true);
}
let shownCodeKey = null;
function renderCodeCards() {
  const box = $("detail");
  const keyNow = `${codeFile?.path}|${codeLine}`;
  const moved = keyNow !== shownCodeKey;
  shownCodeKey = keyNow;
  if (moved) { openCards = new Set(); codeOpen = new Set(); editing = null; }
  const top = box.scrollTop;
  box.replaceChildren();
  if (!codeFile) return;
  const hit = codeLine != null ? codeFile.hits[codeLine] : null;
  const readers = codeFile.read_by.filter((id) => claimById[id] && !(hit?.claims || []).includes(id));
  const cards = el("div", { class: "cards" + (moved ? " moved" : "") });
  if (codeLine == null) {
    cards.append(el("p", { class: "start" }, "Click a marked line to see the claims whose checks matched it. ",
      `${plural(Object.keys(codeFile.hits).length, "line")} in this file ${Object.keys(codeFile.hits).length === 1 ? "is" : "are"} matched; the rest are only read, or not read at all.`));
  } else {
    const claims = (hit?.claims || []).map((id) => claimById[id]).filter(Boolean);
    const fold = claims.length > 3;
    cards.append(el("p", { class: "where" }, el("b", {}, `Line ${codeLine}`),
      claims.length ? `, matched by ${plural(claims.length, "claim")}` : ", matched by no check"),
      ...claims.map(({ sec, claim }) => claimCard(sec, claim, fold, true)));
  }
  if (readers.length) cards.append(el("details", { class: "readers" },
    el("summary", {}, `${plural(readers.length, "other check")} read${readers.length === 1 ? "s" : ""} this file without matching ${codeLine == null ? "a line" : "this line"}`),
    el("ul", {}, readers.slice(0, 40).map((id) => {
      const { sec, claim, doc } = claimById[id];
      return el("li", {}, el("button", { onclick: () => { setHash("#" + new URLSearchParams({ c: doc.concept, s: sec.id, n: claim.n }), false); route(); } }, claim.text));
    })), readers.length > 40 ? el("p", {}, `and ${readers.length - 40} more`) : null));
  box.append(cards);
  box.scrollTop = moved ? 0 : top;
}

/* ---------- routing ---------- */
function writeHash() {
  if (mode === "code") {
    if (!codeFile) return;
    const p = new URLSearchParams({ f: codeFile.path });
    if (codeLine != null) p.set("l", codeLine);
    setHash("#" + p, true);
    return;
  }
  if (!current) return;
  const p = new URLSearchParams({ c: current.concept });
  if (selection) { p.set("s", selection.section); if (selection.n != null) p.set("n", selection.n); }
  setHash("#" + p, true);
}
// Some browsers refuse history calls on a file:// page, so fall back to the plain hash.
let quiet = false;
function setHash(hash, replace) {
  try { history[replace ? "replaceState" : "pushState"](null, "", hash); }
  catch { quiet = true; if (replace) location.replace(hash); else location.hash = hash; }
}
function go(concept) { setHash("#" + new URLSearchParams({ c: concept }), false); route(); }
function goCode(path, line = null) {
  const p = new URLSearchParams({ f: path });
  if (line != null) p.set("l", line);
  setHash("#" + p, false); route();
}
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  const nextMode = p.has("f") ? "code" : "docs";
  if (nextMode !== mode) { mode = nextMode; $("filter").value = ""; }
  renderModes(); renderChips();
  $("page").classList.remove("code-page");
  if (mode !== "code") { codeNodes = {}; codeBlocks = []; shownCodeKey = null; }  // the document view replaces the code rows
  if (mode === "code") {
    const f = DATA.code.files.find((x) => x.path === p.get("f")) || DATA.code.files.find((x) => x.path === firstCodeFile());
    const same = f === codeFile;
    codeFile = f || null;
    codeLine = p.has("l") ? Number(p.get("l")) : null;
    renderTree();
    if (same && codeNodes[1]) { if (codeLine != null) selectLine(codeLine, true); else { for (const r of Object.values(codeNodes)) r.classList.remove("on"); renderCodeCards(); } }
    else { $("viewer").scrollTop = 0; renderCode(); renderCodeCards(); }
    document.querySelector('.doc[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
    return;
  }
  const worst = DATA.concepts.find((d) => d.state === "drift") || DATA.concepts.find((d) => d.state !== "ok");
  current = DATA.concepts.find((d) => d.concept === p.get("c")) || worst || DATA.concepts[0] || null;
  renderTree(); renderDoc();
  const sec = current?.sections.find((s) => s.id === p.get("s"));
  if (sec) select(sec.id, p.has("n") ? Number(p.get("n")) : null, true); else { selection = null; renderCards(); }
  document.querySelector('.doc[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
}

async function load() {
  $("stamp").textContent = "Reading the store…";
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `the server answered ${res.status}`);
    DATA = data;
  } catch (e) {
    $("stamp").textContent = "";
    $("page").replaceChildren(el("p", {}, `Could not read the audit store: ${e.message}. Is kmaudit ui still running? Start it again, then reload this page.`));
    return;
  }
  indexClaims();
  renderBar(); route();
}

$("filter").oninput = () => DATA && renderTree();
window.onhashchange = () => { if (quiet) quiet = false; else if (DATA) route(); };
document.onkeydown = (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !DATA) return;
  const typing = e.target.matches?.("input, textarea");
  if (e.key === "Escape") { if (typing) e.target.blur(); else if (mode === "code") { if (codeFile) goCode(codeFile.path); } else select(null); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); $("filter").focus(); }
  else if (e.key === "j") mode === "code" ? nextLine() : next(null);
  else if (e.key === "k") mode === "code" ? nextLine(true) : next(null, true);
};
load();
</script>
</body>
</html>
