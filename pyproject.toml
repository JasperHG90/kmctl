[project]
name = "kmctl"
# apm/apm.yml carries the one version (ADR 0012); see [tool.hatch.version].
dynamic = ["version"]
description = "Keep a repository's docs/ and OKF knowledge bundle current, across agent harnesses."
readme = "README.md"
authors = [
    { name = "Jasper Ginn", email = "jasperginn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
kmctl = "kmctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Read from the APM package, not git, so a build from a download with no .git
# (as action.yml installs) still has the release version (ADR 0012).
[tool.hatch.version]
source = "regex"
path = "apm/apm.yml"
pattern = '(?m)^version: (?P<version>[^\s#]+)'

[tool.hatch.build.targets.wheel]
packages = ["src/kmctl"]

# The skills ship inside the release, so kmctl briefing can list them (ADR 0001),
# and the agents, which kmctl translates for Antigravity (ADR 0015).
[tool.hatch.build.targets.wheel.force-include]
"apm/.apm/skills" = "kmctl/_skills"
"apm/.apm/agents" = "kmctl/_agents"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "packaging>=26.3",
    "pydantic-ai-slim[openai]==2.57.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

# uv rebuilds kmctl when either file changes, so a local uv run picks up a
# version bump in apm/apm.yml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "apm/apm.yml" }]

[tool.ruff]
# Spike evidence (.loop/), agent rules and skills (.claude/) and the knowledge
# bundle (.okf/) are not project code, and tests/vendor/ is a pinned copy:
# their files are kept as written.
extend-exclude = [".loop", ".claude", ".okf", "tests/vendor"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not integration"]
# The repository root, so tests/scripts/ imports the release scripts as scripts.*.
pythonpath = ["."]
markers = [
    "integration: reaches a real external system, such as GitHub through APM; off by default; the integration gate in .loop/config.toml runs it",
]
