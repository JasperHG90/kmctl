[project]
name = "kmctl"
# The plugin manifest carries the one version (ADR 0012); see [tool.hatch.version].
dynamic = ["version"]
description = "Keep a repository's docs/ and OKF knowledge bundle current, across agent harnesses."
readme = "README.md"
authors = [
    { name = "Jasper Ginn", email = "jasperginn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
kmctl = "kmctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Read from the manifest, not git, so a build from a download with no .git
# (as action.yml installs) still has the release version (ADR 0012).
[tool.hatch.version]
source = "regex"
path = "plugin/.claude-plugin/plugin.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/kmctl"]

# The plugin ships inside the release that installs it (ADR 0001).
[tool.hatch.build.targets.wheel.force-include]
"plugin" = "kmctl/_plugin"
".claude-plugin/marketplace.json" = "kmctl/_marketplace.json"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# uv rebuilds kmctl when either file changes, so a local uv run picks up a
# version bump in the manifest.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "plugin/.claude-plugin/plugin.json" }]

[tool.ruff]
# Spike evidence (.loop/), aim-managed rules (.claude/) and the knowledge
# bundle (.okf/) are not project code, and tests/vendor/ is a pinned copy:
# their files are kept as written.
extend-exclude = [".loop", ".claude", ".okf", "tests/vendor"]

[tool.ruff.lint.per-file-ignores]
# Hermes names a plugin by its folder, kmctl-read; it loads the file by path,
# and nothing imports it as a module by that name.
"action/hermes/kmctl-read/__init__.py" = ["N999"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not integration"]
# The repository root, so tests/scripts/ imports the release scripts as scripts.*.
pythonpath = ["."]
markers = [
    "integration: reaches a real external system, such as GitHub through the claude CLI; off by default; the integration gate in .loop/config.toml runs it",
]
