# The workspace root (ADR 0044): it installs nothing itself. kmctl and kmaudit
# are packages under packages/, each with its own pyproject.toml, sharing the
# one uv.lock, ruff and pytest config here.
[project]
name = "kmctl-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

# pre-commit and prek pip-install a hook repository's root before the hook's
# additional_dependencies (.pre-commit-hooks.yaml), so the root builds an empty
# wheel for them. uv never builds it: see [tool.uv] package = false.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "copier>=9.19.1",
    "ipykernel>=7.4.0",
    "jsonschema>=4.26.0",
    # Both workspace packages, installed editable; their tests run in the root gates.
    "kmaudit[tracing]",
    "kmctl",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "packaging>=26.3",
    "pydantic-ai-slim[openai]==2.57.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kmctl = { workspace = true }
kmaudit = { workspace = true }

[tool.ruff]
# Spike evidence (.loop/), agent rules and skills (.claude/) and the knowledge
# bundle (.okf/) are not project code, and tests/vendor/ is a pinned copy:
# their files are kept as written.
extend-exclude = [".loop", ".claude", ".okf", "tests/vendor"]
# kmctl's code, so import sorting still knows kmctl as first-party, as it did at the root.
src = [".", "packages/kmctl/src"]

[tool.pytest.ini_options]
# -p pytester here, not pytest_plugins in a conftest: pytest refuses that
# outside the top-level conftest, and kmctl's conftest sits in packages/kmctl/tests.
addopts = ["--strict-markers", "-p", "pytester", "-m", "not integration"]
# The repository root, so tests/scripts/ imports the release scripts as scripts.*.
pythonpath = ["."]
markers = [
    "integration: reaches a real external system, such as GitHub through APM; off by default; the integration gate in .loop/config.toml runs it",
]
