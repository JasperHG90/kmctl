# kmctl's APM package (ADR 0013). A consumer adds
# JasperHG90/Knowledge-management/apm#vX.Y.Z and gets the plugin's skills,
# agent and SessionStart hook from plugin/, plus the okf skills. The kmctl CLI
# is installed separately with uv tool install. scripts/release.py set writes
# the version below; plugin/.claude-plugin/plugin.json holds the one version.
name: kmctl
version: 0.2.0
description: kmctl's Claude Code skills, audit agent and SessionStart hook, with the okf skills they use.
dependencies:
  apm:
    - git: parent
      path: plugin
    - scaccogatto/okf-skills#a8b96420de90d102c43cda1693d01ec4f925f2ab
