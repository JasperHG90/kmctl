# Hooks for this repository, run by prek (`just hooks` installs them behind
# loopctl's git hook). Each hook here generates or checks something a test
# also checks, so a commit fixes it before the gates refuse it. CI runs every
# hook on every tracked file (ci.yml, the prek job).
repos:
  - repo: local
    hooks:
      # apm/antigravity/.apm/instructions/ is generated from the Claude rules
      # (ADR 0020). When a staged change touches either side or the script,
      # this writes the copies again; if that changed them, the commit stops
      # so you can stage the new copies.
      - id: sync-antigravity-rules
        name: generate the Antigravity rules
        entry: uv run python -m scripts.sync_antigravity_rules
        language: system
        files: ^(apm/(claude|antigravity)/\.apm/instructions/|scripts/sync_antigravity_rules\.py$)
        pass_filenames: false
      # kmctl check on this repository's own docs/ and .okf/, as the
      # kmctl-check hook in .pre-commit-hooks.yaml runs it elsewhere. --fix
      # rewrites a stale docs folder index; the commit then stops so you can
      # stage it.
      - id: kmctl-check
        name: kmctl check --fix
        entry: uv run kmctl check --fix
        language: system
        files: ^(docs/|\.okf/|README\.md$)
        pass_filenames: false
      # The loop's lint and format gates, run before a commit instead of after.
      # Both fix what they can; the commit then stops so you can stage it.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      # This repository's own .okf/ bundle against the OKF v0.2 spec, strict,
      # with the validator the tests pin.
      - id: okf-validate
        name: okf validate --strict
        entry: uv run python tests/vendor/okf/okf_validate.py .okf --strict
        language: system
        files: ^\.okf/
        pass_filenames: false
