name: Hermes Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Read-only on the code: the agent answers in a comment and never pushes.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hermes-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Inline review comments on a fork's PR get no secrets, so they are
    # skipped. Use /hermes in the PR's conversation instead.
    if: >-
      contains(github.event.comment.body, '/hermes') &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The agent reads the repo's rules, bundle and docs, so on a PR it needs
      # the PR's version of them. A review comment already gets the PR's merge
      # commit; a conversation comment would get the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          persist-credentials: false

      # The prompt and skills come from the default branch, never from the PR:
      # a PR could otherwise rewrite the instructions of an agent that holds
      # the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .hermes-trusted
          sparse-checkout: |
            .github/prompts
            .github/skills
          persist-credentials: false

      - uses: JasperHG90/toiminnot/actions/hermes-interactive@4763b90706d1f689664a7b100f1924c34d15f040 # v1.3.0
        with:
          api_key: ${{ secrets.OLLAMA_API_KEY }}
          model: glm-5.3-flash
          github_token: ${{ github.token }}
          trigger_phrase: '/hermes'
          system_prompt_file: .hermes-trusted/.github/prompts/interactive-system.md
          skills_dir: .hermes-trusted/.github/skills
          quiet_mode: 'false'
          uv_version: '0.11.x'
