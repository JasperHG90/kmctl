# Tag and publish a release when its version pull request lands on main
# (ADR 0012). The job runs once per package: kmctl, whose version source is
# apm/apm.yml and whose tags are vX.Y.Z, and kmaudit, whose version source is
# packages/kmaudit/VERSION and whose tags are kmaudit-vX.Y.Z. Only a push that
# raises a package's version to a releasable version releases it; an unchanged
# or .dev version does nothing, a lowered one fails, and a push with no
# previous commit to compare against (the repository's first push) is skipped.
# A release needs the notes its version pull request committed as
# .github/release-notes/TAG.md: without them it stops before tagging. The wheel
# and sdist are built and checked before the tag exists, so a failed build
# leaves no tag behind; a rerun after a failed publish resumes from the tag it
# pushed. The GitHub Release carries the wheel, the sdist and their checksums,
# with that notes file as its body, unchanged; only a kmctl release is marked
# Latest. Nothing goes to PyPI.
#
# No concurrency group: a group keeps one pending run and cancels the rest,
# which would drop the tag of a version merged between two others.
name: Release tag

on:
  push:
    branches: [main]
    paths:
      - apm/apm.yml
      - packages/kmaudit/VERSION

permissions:
  contents: read

jobs:
  tag:
    name: Tag and publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: [kmctl, kmaudit]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # verdict: raised (tag and release), resume (tag here, release missing),
      # or nothing. A tag at another commit fails.
      - name: Decide whether this push releases
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(uv run scripts/release.py current --package "$PACKAGE")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against (a first push); nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=nothing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add -q --detach "$RUNNER_TEMP/before" "$BEFORE"
          # The before commit's copies of kmctl's version may disagree, so read
          # the version source alone; only a commit with no version there (for
          # kmaudit, one before VERSION existed) gives an empty OLD.
          OLD="$(uv run scripts/release.py --repo "$RUNNER_TEMP/before" manifest --package "$PACKAGE" || true)"
          VERDICT="$(uv run scripts/release.py compare "$OLD" "$VERSION")"
          case "$VERDICT" in
            raised) ;;
            same) echo "$PACKAGE is still $VERSION; nothing to release." >> "$GITHUB_STEP_SUMMARY"; VERDICT=nothing ;;
            skip) echo "$PACKAGE $VERSION is a .dev or +local version, which is never released." >> "$GITHUB_STEP_SUMMARY"; VERDICT=nothing ;;
            lowered) echo "::error::This push lowers $PACKAGE from $OLD to $VERSION. Raise it instead."; exit 1 ;;
          esac
          if [ "$VERDICT" = "raised" ]; then
            TAG="$(uv run scripts/release.py tag "$VERSION" --package "$PACKAGE")"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          if [ "$VERDICT" = "raised" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAGGED="$(git rev-list -n 1 "$TAG")"
            if [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already tags $TAGGED, not this commit $GITHUB_SHA. Pick the next version."
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG is already tagged and released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              VERDICT=nothing
            else
              echo "$TAG is tagged here but has no Release; resuming." >> "$GITHUB_STEP_SUMMARY"
              VERDICT=resume
            fi
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
      # The notes were reviewed in the version pull request; without them the
      # release would publish nothing, so stop before the tag exists.
      - name: Refuse a release without its committed notes
        if: ${{ steps.plan.outputs.verdict == 'raised' || steps.plan.outputs.verdict == 'resume' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::$NOTES is missing or blank, so $TAG has no notes to publish. Run the Release workflow for $PACKAGE, which drafts them into the version pull request, or add the file in a pull request."
            exit 1
          fi
      # A commit that reached main after the Release run drafted the notes
      # ships in the tag with no bullet. Find the drafted commit from the
      # Drafted-From trailer (on the release branch's own commits for a merge,
      # on the pushed commit for a squash), else from the parent of the
      # merge's second parent, and name this package's commits since it. The
      # notes stay as reviewed.
      - name: Name commits that landed after the notes were drafted
        if: ${{ steps.plan.outputs.verdict == 'raised' || steps.plan.outputs.verdict == 'resume' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a PARENTS <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          FIRST="${PARENTS[1]:-}"
          # Print the first Drafted-From hash in stdin. awk reads all of it,
          # so the writer never dies of SIGPIPE under pipefail.
          drafted_from() {
            awk '!d && match($0, /Drafted-From: *[0-9a-f]+/) {
                d = substr($0, RSTART, RLENGTH); sub(/^Drafted-From: */, "", d)
              }
              END { if (length(d) >= 7 && length(d) <= 40) print d }'
          }
          if [ "${#PARENTS[@]}" -eq 3 ]; then
            # An "Update branch" merge on the release branch makes the second
            # parent's parent a merge that already holds the late commits, so
            # read the release commit's trailer first.
            DRAFTED="$(git log --format=%B "$FIRST..${PARENTS[2]}" | drafted_from)"
            if [ -z "$DRAFTED" ]; then
              DRAFTED="$(git rev-parse "${PARENTS[2]}^")"
            fi
          else
            DRAFTED="$(git log -1 --format=%B "$GITHUB_SHA" | drafted_from)"
          fi
          if [ -z "$FIRST" ] || [ -z "$DRAFTED" ] || ! git cat-file -e "$DRAFTED^{commit}" 2>/dev/null; then
            echo "::warning::Could not find the commit the $TAG notes were drafted from, so commits that landed after the draft are not named. Compare the notes with the history by hand."
            exit 0
          fi
          LATE=()
          for c in $(git rev-list --first-parent "$DRAFTED..$FIRST"); do
            subject="$(git log -1 --format=%s "$c")"
            case "$subject" in "loop: "* | "release: "* | "Merge pull request #"*/release/*) continue ;; esac
            if git diff --name-only "$c^1" "$c" | awk -v p="$PACKAGE" '
                p == "kmaudit" && /^packages\/kmaudit\// { f = 1 }
                p == "kmctl" && (/^packages\/kmctl\// || !/^packages\//) { f = 1 }
                END { exit !f }'; then
              LATE+=("$(git log -1 --format='%h %s' "$c")")
            fi
          done
          if [ "${#LATE[@]}" -eq 0 ]; then
            exit 0
          fi
          NAMES="$(printf '%s; ' "${LATE[@]}")"
          echo "::warning::$TAG ships ${#LATE[@]} $PACKAGE commit(s) that landed after its notes were drafted from $DRAFTED, which the published notes leave out: ${NAMES%; }. Add them with gh release edit $TAG --notes-file FILE."
          {
            echo "## Commits missing from the $TAG notes"
            echo
            echo "These $PACKAGE commits landed on main after the notes were drafted from \`$DRAFTED\`. The Release publishes the reviewed notes unchanged; add them with \`gh release edit $TAG --notes-file FILE\`."
            echo
            printf -- '- %s\n' "${LATE[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and check the release files
        if: ${{ steps.plan.outputs.verdict == 'raised' || steps.plan.outputs.verdict == 'resume' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          uv build --package "$PACKAGE" -o dist
          for file in dist/*; do
            case "$(basename "$file")" in
              *-"$VERSION"-*.whl | *-"$VERSION".tar.gz) ;;
              *) echo "::error::$file does not carry version $VERSION."; exit 1 ;;
            esac
          done
          uvx twine check dist/*
          uv run scripts/check_wheel.py --package "$PACKAGE" dist/*.whl
          uv run scripts/smoke_wheel.py --package "$PACKAGE" dist/*.whl --version "$VERSION"
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Push the annotated tag
        if: ${{ steps.plan.outputs.verdict == 'raised' }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$PACKAGE $VERSION" "$GITHUB_SHA"
          git push origin "$TAG"
      # Users pin kmctl's tags, so only a kmctl release becomes Latest.
      - name: Publish the GitHub Release
        if: ${{ steps.plan.outputs.verdict == 'raised' || steps.plan.outputs.verdict == 'resume' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --verify-tag --notes-file ".github/release-notes/$TAG.md")
          if uv run scripts/release.py is-prerelease "$VERSION"; then
            ARGS+=(--prerelease --latest=false)
          elif [ "$PACKAGE" = kmctl ]; then
            ARGS+=(--latest)
          else
            ARGS+=(--latest=false)
          fi
          gh release create "$TAG" "${ARGS[@]}" dist/*
          echo "Released $TAG." >> "$GITHUB_STEP_SUMMARY"
