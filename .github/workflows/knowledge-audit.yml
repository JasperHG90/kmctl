name: knowledge audit

# On a pull request from this repository, a model rereads each .okf/ and
# docs/ page whose sources the pull request changed, and one comment says
# which still hold (ADR 0060). It never fails the pull request's check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Each step below is one command, the same ones action.yml's audit and
# publish modes run, so a reader sees everything the audit does. This
# repository runs action/agent.py from its own checkout; another repository
# uses the action at a pinned release.
jobs:
  # The agent sends the pages to a model with the API key. A fork's pull
  # request gets no secrets, so both jobs skip it. The agent has no shell and
  # this job no GitHub token, so the key and a token stay out of its reach.
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No token left in git config for the agent to read; full history for
      # the comparison with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # DeepSeek V4.1 Flash on Ollama Cloud: AUDIT_API_KEY holds an Ollama API
      # key. Any provider works. Change base_url and model to your own endpoint
      # (Ollama, Bifrost, OpenRouter, a vendor's API) and put its key in the
      # AUDIT_API_KEY secret, or drop --base-url and name a PydanticAI provider,
      # such as --model openai:gpt-5 with OPENAI_API_KEY set. A weaker model
      # may miss drift. With no page in scope the agent calls no model.
      - name: Run the agent
        timeout-minutes: 40
        env:
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
        run: >-
          uv run --no-config --script action/agent.py run
          --model deepseek-v4.1-flash
          --base-url https://ollama.com/v1
          --api-key-env AUDIT_API_KEY
          --base origin/${{ github.base_ref }}
          --timeout 30m
          --out ${{ runner.temp }}/agent-report
      # The report, the findings as JSON and the full transcript.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent-report
          if-no-files-found: ignore

  # A fresh runner that shares only the artifact with the agent's job, so
  # nothing the agent changed runs with the token. It posts one comment on
  # the pull request when a finding is high, and replaces it on each push. It
  # runs unless the run was cancelled; a missing report posts nothing, and
  # the failed audit job shows why.
  publish:
    needs: audit
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only to read the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # A failed audit leaves no artifact; publish then posts nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent-report
      - name: Publish the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          uv run --no-config --script action/agent.py publish
          ${{ runner.temp }}/agent-report/report.json
          --pr ${{ github.event.pull_request.number }}
          --min-severity high
          --title "Knowledge audit"
