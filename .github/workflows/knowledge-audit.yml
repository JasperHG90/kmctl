name: knowledge audit

# A model rereads each .okf/ and docs/ page whose sources a pull request
# changed, and one comment says which still hold (ADR 0060, ADR 0061). It
# runs when someone starts it on a ready pull request, on that pull
# request's branch, so its check lands on the pull request's head:
#
#   gh workflow run knowledge-audit.yml --ref BRANCH -f pr=NUMBER
#
# Mark the audit check required: a refusal fails it, and a push after a run
# leaves the new commit waiting for another run. Findings never fail it.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to audit; run on its branch.
        required: true
        type: number

permissions:
  contents: read

# Each step below is one command, the same ones action.yml's audit and
# publish modes run, so a reader sees everything the audit does. This
# repository runs action/agent.py from its own checkout; another repository
# uses the action at a pinned release.
jobs:
  # Looks the pull request up and refuses one that is closed, a draft, from a
  # fork, or whose head is not this run's commit; then reads the audit
  # comment and hands the report of the run it links to the audit job. Only
  # this job and publish hold a token.
  previous:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.fetch.outputs.pr }}
      base: ${{ steps.fetch.outputs.base }}
      head: ${{ steps.fetch.outputs.head }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Only to read the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Resolve the pull request and fetch the previous report
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: >-
          uv run --no-config --script action/agent.py previous
          --pr "$PR"
          --resolve ${{ github.sha }}
          --out ${{ runner.temp }}/previous-report
      - name: Hand the previous report on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-report
          path: ${{ runner.temp }}/previous-report
          if-no-files-found: ignore

  # The agent sends the pages to a model with the API key. It has no shell
  # and this job no GitHub token, so the key and a token stay out of its
  # reach. Never skipped, so a refusal leaves a failed check rather than a skipped
  # one, which a required check would count as passing.
  audit:
    needs: previous
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless the pull request was resolved
        env:
          RESULT: ${{ needs.previous.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "knowledge audit: the previous job did not resolve the pull request ($RESULT); see its log." >&2
            exit 1
          fi
      # No token left in git config for the agent to read; full history for
      # the comparison with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # DeepSeek V4.1 Flash on Ollama Cloud: AUDIT_API_KEY holds an Ollama API
      # key. Any provider works. Change base_url and model to your own endpoint
      # (Ollama, Bifrost, OpenRouter, a vendor's API) and put its key in the
      # AUDIT_API_KEY secret, or drop --base-url and name a PydanticAI provider,
      # such as --model openai:gpt-5 with OPENAI_API_KEY set. A weaker model
      # may miss drift. With no page in scope the agent calls no model.
      # The first run on a pull request has no previous report.
      - name: Download the previous report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-report
          path: ${{ runner.temp }}/previous-report
      # --head: the checkout is a merge commit made for this run alone, so the
      # report records the pull request's head, which the next run has.
      - name: Run the agent
        timeout-minutes: 40
        env:
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
          PREVIOUS: ${{ runner.temp }}/previous-report/report.json
        run: |
          args=(run
            --model deepseek-v4.1-flash
            --base-url https://ollama.com/v1
            --api-key-env AUDIT_API_KEY
            --base "origin/${{ needs.previous.outputs.base }}"
            --head "${{ needs.previous.outputs.head }}"
            --timeout 30m
            --out "${{ runner.temp }}/agent-report")
          [ -f "$PREVIOUS" ] && args+=(--previous "$PREVIOUS")
          uv run --no-config --script action/agent.py "${args[@]}"
      # The report, the findings as JSON and the full transcript.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent-report
          if-no-files-found: ignore

  # A fresh runner that shares only the artifact with the agent's job, so
  # nothing the agent changed runs with the token. It posts one comment on
  # the pull request when there is a finding, and replaces it on each run. It
  # runs once the pull request was resolved, unless the run was cancelled; a
  # missing report posts nothing, and the failed audit job shows why.
  publish:
    needs: [previous, audit]
    if: ${{ !cancelled() && needs.previous.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only to read the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # A failed audit leaves no artifact; publish then posts nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent-report
      - name: Publish the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          uv run --no-config --script action/agent.py publish
          ${{ runner.temp }}/agent-report/report.json
          --pr ${{ needs.previous.outputs.pr }}
          --title "Knowledge audit"
