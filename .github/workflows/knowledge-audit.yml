name: knowledge audit
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=success -f context=audit-spike -f description="spike"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/knowledge-audit.yml"
