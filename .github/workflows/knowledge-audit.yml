name: knowledge audit

# The agent sends the repository to a model with the API key, so it runs only
# by hand or on a schedule, never on a pull request (ADR 0005).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# The issue step needs issues: write; nothing else writes.
permissions:
  contents: read
  issues: write

# Each step below is one command, the same ones action.yml's audit mode runs,
# so a reader sees everything the audit does (ADR 0017).
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # No token left in git config for the agent to read; full history for review due.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # The default audit runs kmctl review due through the agent's shell.
      - name: Install kmctl from this checkout
        run: uv tool install .
      # Any provider works. Change base_url and model to your own endpoint
      # (Ollama, Bifrost, OpenRouter, a vendor's API) and put its key in the
      # AUDIT_API_KEY secret, or drop --base-url and name a PydanticAI provider,
      # such as --model openai:gpt-5 with OPENAI_API_KEY set. Add --prompt-file,
      # --context and --skills to give the agent another task, more folders to
      # read and more skills. No GitHub token is set here: the agent runs shell
      # commands and must not be able to read one.
      - name: Run the agent
        timeout-minutes: 40
        env:
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
        run: >-
          uv run --script action/agent.py run
          --model qwen/qwen3-coder
          --base-url https://openrouter.ai/api/v1
          --api-key-env AUDIT_API_KEY
          --timeout 30m
          --out ${{ runner.temp }}/agent-report
      # The report, the findings as JSON and the full transcript.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent-report
          if-no-files-found: ignore
      # Only this step gets the token; it posts the report the agent wrote.
      - name: Post the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash action/knowledge-audit-issue.sh ${{ runner.temp }}/agent-report/report.md
