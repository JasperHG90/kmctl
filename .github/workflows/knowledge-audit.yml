name: knowledge audit

# Audit mode sends the repository to a model with the API key, so it runs only
# by hand or on a schedule, never on a pull request (ADR 0005).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# The issue step needs issues: write; nothing else writes.
permissions:
  contents: read
  issues: write

# Each step below is one command, the same ones action.yml's audit mode runs,
# so a reader sees everything the audit does (ADR 0010).
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # No token left in git config for the model to read; full history for review due.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install kmctl from this checkout
        run: uv tool install .
      - name: Install Hermes Agent
        run: uv tool install --python 3.12 hermes-agent==0.19.0
      # The model and where it is served. Any OpenAI-compatible endpoint works
      # with provider custom: change base_url and model to your own (Ollama,
      # Bifrost, OpenRouter, a vendor's API), and put its key in the
      # AUDIT_API_KEY secret. No GitHub token is set here: the model's process
      # must not be able to read one.
      - name: Audit knowledge
        timeout-minutes: 40
        env:
          KMCTL_AUDIT_PROVIDER: custom
          KMCTL_AUDIT_BASE_URL: https://openrouter.ai/api/v1
          KMCTL_AUDIT_MODEL: qwen/qwen3-coder
          KMCTL_AUDIT_API_KEY_ENV: AUDIT_API_KEY
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
          KMCTL_AUDIT_TIMEOUT: 30m
          KMCTL_PLUGIN_DIR: ${{ github.workspace }}/plugin
        run: bash action/knowledge-audit.sh
      # Only this step gets the token; it posts the body the audit wrote.
      - name: Post the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash action/knowledge-audit-issue.sh
