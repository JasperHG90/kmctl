name: knowledge audit
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=success -f context=audit-spike -f description=spike
